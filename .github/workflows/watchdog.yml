name: AEZA Hysteria2 VPN watchdog

on:
  schedule:
    # Offset away from the top of the hour; GitHub may delay scheduled runs.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeza-vpn-watchdog
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AEZA_API_KEY: ${{ secrets.AEZA_API_KEY }}
      HYSTERIA2_URI: ${{ secrets.HYSTERIA2_URI }}
      ENABLE_REBOOT: ${{ vars.ENABLE_REBOOT || 'false' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore watchdog state
        uses: actions/cache/restore@v4
        with:
          path: .watchdog-state/state.json
          key: aeza-watchdog-state-${{ github.run_id }}
          restore-keys: |
            aeza-watchdog-state-

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AEZA_API_KEY" || { echo 'Missing repository secret AEZA_API_KEY'; exit 1; }
          test -n "$HYSTERIA2_URI" || { echo 'Missing repository secret HYSTERIA2_URI'; exit 1; }
          mkdir -p .watchdog-state

      - name: Install Hysteria2 client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            'https://github.com/apernet/hysteria/releases/latest/download/hysteria-linux-amd64' \
            --output /tmp/hysteria
          chmod 700 /tmp/hysteria
          /tmp/hysteria version | head -n 3

      - name: Run watchdog
        id: watchdog
        run: python3 watchdog.py

      - name: Save watchdog state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .watchdog-state/state.json
          key: aeza-watchdog-state-${{ github.run_id }}
